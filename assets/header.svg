<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Antonio Filho — Software Engineer</title>
<desc id="desc">Building KnoVet. Engineering at Care Continuity. Software for real people.</desc>
<defs>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#253444"/></pattern>
<linearGradient id="glow"><stop stop-color="#76e6b5"/><stop offset="1" stop-color="#6ebeff"/></linearGradient>
</defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.cursor{animation:blink 1.2s steps(2,end) infinite}
.signal{animation:pulse 2.5s ease-in-out infinite}
.trace{stroke-dasharray:12 14;animation:flow 12s linear infinite}
.a{animation:first 12s infinite}.b{animation:second 12s infinite}.c{animation:third 12s infinite}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{50%{opacity:.3}}
@keyframes flow{to{stroke-dashoffset:-260}}
@keyframes first{0%,27%,100%{opacity:1}32%,95%{opacity:0}}
@keyframes second{0%,28%,65%,100%{opacity:0}33%,60%{opacity:1}}
@keyframes third{0%,61%,100%{opacity:0}66%,94%{opacity:1}}
@media(prefers-reduced-motion:reduce){.cursor,.signal,.trace,.a,.b,.c{animation:none}.b,.c{opacity:0}}
</style>
<rect width="1200" height="360" rx="20" fill="#0b111b"/>
<rect x="1" y="1" width="1198" height="358" rx="19" fill="url(#dots)" stroke="#263345"/>
<path d="M850 360V240l110-90h240M950 360V280l110-90h140" fill="none" stroke="#203747" stroke-width="2"/>
<path class="trace" d="M850 360V240l110-90h240" fill="none" stroke="#76e6b5" stroke-width="2" opacity=".6"/>
<circle cx="1100" cy="52" r="5" fill="#76e6b5" class="signal"/>
<text x="56" y="56" fill="#8ea2b8" font-size="15" letter-spacing="3">ANTONIOFIGLIO / SOFTWARE ENGINEER</text>
<text x="52" y="153" fill="#edf5ff" font-size="68" font-weight="700" letter-spacing="-3">ANTONIO FILHO<tspan fill="#76e6b5" class="cursor">_</tspan></text>
<g fill="url(#glow)" font-size="29" font-weight="500">
<text x="56" y="211" class="a">Building KnoVet.</text>
<text x="56" y="211" class="b" opacity="0">Engineering at Care Continuity.</text>
<text x="56" y="211" class="c" opacity="0">Software for real people.</text>
</g>
<path d="M56 250h1088" stroke="#263345"/>
<text x="56" y="294" fill="#8ea2b8" font-size="16">HEALTHCARE<tspan dx="24" fill="#76e6b5">/</tspan><tspan dx="24">PET TECH</tspan><tspan dx="24" fill="#76e6b5">/</tspan><tspan dx="24">APPLIED AI</tspan></text>
</svg>